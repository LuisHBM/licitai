[project]
name = "licitai"
version = "0.1.0"
description = "Plataforma de análise de licitações públicas"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "dynaconf>=3.2.13",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["licitai"]

[dependency-groups]
dev = [
    "ipython>=8",
    "pytest>=8",
]
