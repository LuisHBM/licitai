[project]
name = "licitai"
version = "0.1.0"
description = "Plataforma de análise de licitações públicas"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "dynaconf>=3.2.13",
    "fastapi>=0.115",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "curl-cffi>=0.7",
    "playwright>=1.44",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.30",
    "google-generativeai>=0.8.6",
    "langchain-google-genai>=4.2.4",
    "langchain>=1.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["licitai"]

[dependency-groups]
dev = [
    "black>=24.0",
    "httpx>=0.27",
    "ipython>=8",
    "pytest>=8",
    "pytest-mock>=3.14",
]
