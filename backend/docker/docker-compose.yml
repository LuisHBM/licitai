services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: licitai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: licitai
      POSTGRES_DB: licitai
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: licitai_backend
    ports:
      - "8000:8000"
    environment:
      LICITAI_DB_HOST: postgres
      LICITAI_DB_PORT: 5432
      LICITAI_DB_PASSWORD: licitai
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DEV: "true"
    container_name: licitai_tests
    command: pytest
    profiles:
      - test

volumes:
  pgdata:
