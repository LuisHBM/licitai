services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: licitai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: licitai
      POSTGRES_DB: licitai
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
